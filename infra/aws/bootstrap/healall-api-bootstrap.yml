AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup so GitHub Actions can deploy the HealAll API (healall-api-prod)
  without any long-lived AWS keys. Run by a human with admin rights, once, via
  bootstrap.sh. Never deployed from CI, so the deploy role cannot widen its own
  permissions.

  Creates:
    * GitHub OIDC provider (only if the account has none yet)
    * IAM role healall-gha-api-deploy, assumable only by GitHub Actions running
      on main of HealAll-India/HealAll, limited to the healall-api resources
    * ECR repository healall-api (keeps the last 5 images)
    * A monthly AWS Budgets alarm for the whole account, emailed to you

  Everything here is free except ECR image storage (about $0.10 per GB-month).

Parameters:
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of the account's existing token.actions.githubusercontent.com OIDC
      provider (the media stack may already have created one). Leave empty to
      create it here. bootstrap.sh fills this in for you.

  GitHubSubject:
    Type: String
    Default: repo:HealAll-India/HealAll:ref:refs/heads/main
    Description: OIDC sub claim allowed to assume the role. Main only.

  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod]

  ApiDomainName:
    Type: String
    Default: api.healallindia.com

  BudgetEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Where the budget alarm emails go. Passed at deploy time, never committed.

  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Alarm when the account's monthly AWS bill reaches 80% of this, or is forecast to pass it.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: healall-api
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          # Lambda pulls the image itself when the function is created or updated.
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                "aws:sourceArn": !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:healall-api-*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # Deliberately outside the healall-api-* prefix the role may manage.
      RoleName: healall-gha-api-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Ref GitHubSubject
      Policies:
        - PolicyName: HealAllApiDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationApiStackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/healall-api-${Environment}/*"
              - Sid: CloudFormationReadOnly
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"

              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !GetAtt ApiRepository.Arn

              - Sid: LambdaApiFunctionOnly
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetRuntimeManagementConfig
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:healall-api-*"

              # The function's own execution role. It may only ever carry the
              # basic logging policy, so CI cannot mint a more powerful role.
              - Sid: FunctionRoleManage
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/healall-api-*"
              - Sid: FunctionRoleBasicPolicyOnly
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/healall-api-*"
                Condition:
                  ArnEquals:
                    "iam:PolicyARN": !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
              - Sid: FunctionRolePassToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/healall-api-*"
                Condition:
                  StringEquals:
                    "iam:PassedToService": lambda.amazonaws.com

              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/healall-api-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/healall-api-*:*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"

              # HTTP APIs cannot be scoped by name, only by region. The custom
              # domain is pinned to the API's hostname.
              - Sid: HttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/${ApiDomainName}"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/${ApiDomainName}/*"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*"

              # Certificates are free. RequestCertificate cannot be scoped.
              - Sid: Certificate
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                Resource: "*"

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: healall-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  DeployRoleArn:
    Description: Set as the GitHub repo variable AWS_API_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
