AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HealAll API on AWS Lambda behind an API Gateway HTTP API, served at
  api.healallindia.com. Scales to zero: nothing runs, and nothing is billed
  beyond storage, while nobody is using the app. Deployed by deploy.sh in
  this folder, which builds the image, runs migrations and fills these
  parameters from infra/aws/api/.env.prod.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]
  ImageUri:
    Type: String
    Description: ECR image URI with tag, pushed by deploy.sh.
  ApiDomainName:
    Type: String
    Default: api.healallindia.com
  CertificateArn:
    Type: String
    Description: Issued ACM certificate for ApiDomainName in this region (deploy.sh requests it).
  MemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 3008
    Description: MB. Lambda's CPU share grows with memory, so 1024 starts noticeably faster than 512.
  ThrottleRate:
    Type: Number
    Default: 25
    Description: Steady requests per second across the API. Caps cost and database load under abuse.
  ThrottleBurst:
    Type: Number
    Default: 50
  LogRetentionDays:
    Type: Number
    Default: 7
    Description: >
      Days CloudWatch keeps the API's logs. Storage is a rounding error; what
      bills is ingestion past the 5 GB a month free tier, which this API stays
      far below (INFO level, one access line per request, no bodies).

  # App settings that are not secret. Secrets (APP_SECRET_KEY, JWT_SECRET_KEY,
  # DATABASE_URL, REDIS_URL, RESEND_API_KEY, MSG91_API_KEY, SENTRY_DSN,
  # GROQ_API_KEY, GEMINI_API_KEY, VAPID_PRIVATE_KEY, METRICS_TOKEN) live in
  # the Secrets Manager secret healall-api-<env>/app, created by the bootstrap
  # stack and filled by put-secrets.sh. The function reads it at start-up, so
  # they never appear in the stack's parameters or the function's settings.
  AllowedOrigins:
    Type: String
    Default: https://healallindia.com,https://www.healallindia.com
  AllowedOriginRegex:
    Type: String
    Default: ""
    Description: Optional regex for extra CORS origins, e.g. Vercel preview URLs. Empty allows none.
  S3Region:
    Type: String
    Default: ap-south-1
  S3BucketMedia:
    Type: String
    Default: healall-media-prod
  S3BucketIdentity:
    Type: String
    Default: healall-identity-ephemeral-prod
  Msg91TemplateIdOtp:
    Type: String
    Default: ""
  GoogleClientId:
    Type: String
    Default: ""
  AiTriageEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  # Web push stays off until both VAPID keys are set (the private one is in the secret).
  VapidPublicKey:
    Type: String
    Default: ""

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/healall-api-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Logs, plus the runtime policy from the bootstrap stack: read the app
      # secret and use the two S3 buckets. No long-lived AWS keys.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/healall-api-${Environment}-runtime

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub healall-api-${Environment}
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      # API Gateway gives up at 30 s.
      Timeout: 29
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_SECRETS_ARN: !Sub healall-api-${Environment}/app
          APP_ALLOWED_ORIGINS: !Ref AllowedOrigins
          APP_ALLOWED_ORIGIN_REGEX: !Ref AllowedOriginRegex
          # Empty keys: boto3 uses the function's role for S3.
          S3_ACCESS_KEY: ""
          S3_SECRET_KEY: ""
          S3_REGION: !Ref S3Region
          S3_ENDPOINT_URL: !Sub https://s3.${S3Region}.amazonaws.com
          S3_BUCKET_MEDIA: !Ref S3BucketMedia
          S3_BUCKET_IDENTITY: !Ref S3BucketIdentity
          MSG91_TEMPLATE_ID_OTP: !Ref Msg91TemplateIdOtp
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          AI_TRIAGE_ENABLED: !Ref AiTriageEnabled
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub healall-api-${Environment}
      ProtocolType: HTTP
      # CORS is the app's job (APP_ALLOWED_ORIGINS); preflights reach it too.

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRate
        ThrottlingBurstLimit: !Ref ThrottleBurst

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: HttpApiStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: $default

Outputs:
  DefaultEndpoint:
    Description: Test the API here before pointing DNS at it.
    Value: !GetAtt HttpApi.ApiEndpoint
  DnsTarget:
    Description: Point the api CNAME (Cloudflare) at this.
    Value: !GetAtt ApiDomain.RegionalDomainName
  FunctionName:
    Value: !Ref ApiFunction
