global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers: []

scrape_configs:
  # HealAll FastAPI backend — runs on host machine via `make dev`
  - job_name: healall_api
    static_configs:
      - targets:
          - host.docker.internal:8000
    metrics_path: /metrics
