name: Vercel Deploy

# Vercel's Git integration cannot auto-deploy a PRIVATE repo owned by a
# GitHub *organisation* on the Hobby plan. This workflow replaces that
# integration: it builds with the Vercel CLI and deploys via a token, which
# works on Hobby for private org repos. Disconnect the Vercel dashboard Git
# integration once this is green so the two don't double-deploy.
#
# Required repo secret:  VERCEL_TOKEN  (https://vercel.com/account/tokens)
# The org/project IDs below are not secret — they only identify the project.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_IjiAiyWZYv6egBzGITomVwM8
  VERCEL_PROJECT_ID: prj_jIsyDXYr4sq0zedDpJ5JC7g24GTu
  # The Vercel CLI reads VERCEL_TOKEN from the environment automatically, so we
  # no longer pass --token= (an empty flag produced the confusing "No existing
  # credentials found" error when the secret was unset).
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on forks — they cannot access the VERCEL_TOKEN secret anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Preflight — is VERCEL_TOKEN configured?
        id: pre
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            # No token: this is the normal state while the repo is PUBLIC and
            # Vercel's own Git integration handles deploys. Skip cleanly (green)
            # instead of failing — only deploy from CI when a token is present
            # (e.g. after switching the repo back to private org + on Hobby).
            echo "::notice title=VERCEL_TOKEN not set::Skipping CLI deploy — Vercel's Git integration handles public-repo deploys. Add VERCEL_TOKEN to deploy from CI instead."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pre.outputs.has_token == 'true'

      - uses: actions/setup-node@v5
        if: steps.pre.outputs.has_token == 'true'
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.pre.outputs.has_token == 'true'
        run: npm install --global vercel@39

      - name: Determine environment
        id: env
        if: steps.pre.outputs.has_token == 'true'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "vercel_env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Vercel CLI 39.x does NOT read the token from the VERCEL_TOKEN env var
      # for `pull` (it errors "No existing credentials found"), so pass it
      # explicitly. The preflight above guarantees it is non-empty here, so
      # this never expands to a bare `--token=` flag.
      - name: Pull Vercel project settings + env
        if: steps.pre.outputs.has_token == 'true'
        run: vercel pull --yes --environment=${{ steps.env.outputs.vercel_env }} --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.pre.outputs.has_token == 'true'
        run: vercel build ${{ steps.env.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        if: steps.pre.outputs.has_token == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.env.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.pre.outputs.has_token == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-cli-deploy -->';
            const body = `${marker}\n🔼 **Preview deploy ready:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
