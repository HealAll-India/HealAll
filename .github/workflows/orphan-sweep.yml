name: Orphaned files sweep

# Deletes uploads whose user or post no longer exists (see
# backend/scripts/purge_orphaned_files.py). Account deletion promises photos
# are gone within 30 days, and this weekly run is what keeps that promise when
# the immediate cleanup misses a file.
#
# Off until the repo variable ORPHAN_SWEEP_ENABLED is 'true'. The weekly run
# deletes; a manual run is a dry run unless "apply" is ticked. The script
# exits 1 when any folder can't be deleted, which fails the run, and GitHub
# emails the repo owner about a failed scheduled run.

on:
  schedule:
    - cron: "30 21 * * 0"  # Sundays 21:30 UTC (Monday 03:00 IST)
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete the orphaned files (unticked: only list them)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orphan-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.ORPHAN_SWEEP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      PYTHONPATH: ${{ github.workspace }}/backend
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: ${{ vars.S3_REGION || 'ap-south-1' }}
      S3_ENDPOINT_URL: https://s3.${{ vars.S3_REGION || 'ap-south-1' }}.amazonaws.com
      S3_BUCKET_MEDIA: ${{ vars.S3_BUCKET_MEDIA || 'healall-media-prod' }}
      S3_BUCKET_IDENTITY: ${{ vars.S3_BUCKET_IDENTITY || 'healall-identity-ephemeral-prod' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep orphaned files
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python scripts/purge_orphaned_files.py --apply
          else
            python scripts/purge_orphaned_files.py
          fi
