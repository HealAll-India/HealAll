name: aws-infra

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/cloudformation/**"
      - ".github/workflows/aws-infra.yml"
  workflow_dispatch:

permissions:
  id-token: write   # Required for the AWS OIDC token exchange.
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: prod
  STACK_NAME: healall-media-prod
  TEMPLATE_PATH: infra/aws/cloudformation/healall-media.yml

jobs:
  deploy:
    concurrency:
      group: aws-infra-healall-media-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_PATH}"

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_PATH" \
            --parameter-overrides "Environment=$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
