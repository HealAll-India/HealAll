name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt

      - name: Install ruff
        run: python -m pip install ruff --prefer-binary
        working-directory: backend

      - name: Ruff check
        run: ruff check app/ tests/
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check app/ tests/
        working-directory: backend

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: healall
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: healall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healall -d healall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      APP_ENV: development
      APP_DEBUG: "false"
      APP_SECRET_KEY: ci-test-app-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://healall:changeme@localhost:5432/healall
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-production
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" --prefer-binary
        working-directory: backend

      - name: Create migrations database
        run: |
          PGPASSWORD=changeme psql \
            -h localhost -U healall -d healall_test \
            -c "CREATE DATABASE healall;"

      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth-users
            paths: >-
              tests/test_google_auth.py
              tests/integration/test_auth_flow.py
              tests/integration/test_users.py
          - shard: posts-feed
            paths: >-
              tests/integration/test_posts.py
              tests/integration/test_feed.py
              tests/integration/test_comments.py
          - shard: cases-messages
            paths: >-
              tests/test_health.py
              tests/integration/test_cases.py
              tests/integration/test_messages.py
          - shard: moderation-verification
            paths: >-
              tests/integration/test_moderation.py
              tests/integration/test_reports.py
              tests/integration/test_verification.py

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: healall
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: healall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healall -d healall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # App
      APP_ENV: development
      APP_DEBUG: "false"
      APP_SECRET_KEY: ci-test-app-secret-key-not-for-production
      APP_ALLOWED_ORIGINS: "http://localhost:3000"

      # Database — used for migrations and tests
      DATABASE_URL: postgresql+asyncpg://healall:changeme@localhost:5432/healall

      # Redis
      REDIS_URL: redis://localhost:6379/0

      # JWT
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"

      # S3 — stub/no-op in CI
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_MEDIA: healall-media
      S3_BUCKET_IDENTITY: healall-identity-ephemeral
      S3_REGION: us-east-1

      # SMS — stub provider, no real credentials needed
      SMS_PROVIDER: stub
      SMS_API_KEY: ""
      SMS_SENDER_ID: HEALALL

      # Email — stub provider, no real credentials needed
      EMAIL_PROVIDER: stub
      EMAIL_SMTP_HOST: ""
      EMAIL_SMTP_PORT: "587"
      EMAIL_SMTP_USER: ""
      EMAIL_SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@healall.in

      # Aadhaar — stub provider, no real credentials needed
      AADHAAR_PROVIDER: stub
      AADHAAR_API_KEY: ""
      AADHAAR_API_URL: ""

      # Sentry — disabled in CI
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" --prefer-binary
        working-directory: backend

      - name: Run tests (${{ matrix.shard }})
        run: pytest ${{ matrix.paths }} --tb=short --cov=app --cov-report=xml:coverage-${{ matrix.shard }}.xml
        working-directory: backend

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage-${{ matrix.shard }}.xml
          flags: backend,backend-${{ matrix.shard }}
          name: backend-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
