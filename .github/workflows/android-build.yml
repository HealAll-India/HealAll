name: Android Build

# Builds the HealAll Android app (a Trusted Web Activity over
# healallindia.com) from android/twa-manifest.json with Bubblewrap.
#
# - On a PR or push that touches android/, it checks that the app builds,
#   signed with a throwaway key. Those files can't go to Play.
# - Run it by hand from the Actions tab to build a release for Play. With the
#   ANDROID_KEYSTORE_* secrets set, the .aab is signed with the upload key.
#
# Secrets (only needed for a Play release, see android/README.md):
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code (must go up with every Play upload)
        required: true
        type: number
      version_name:
        description: Version name shown on Play, like 1.0.1
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUBBLEWRAP_VERSION: '1.28.0'
  # Bubblewrap 1.28 builds with this build-tools version (targetSdk 36).
  BUILD_TOOLS_VERSION: '36.1.0'

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Bubblewrap
        run: npm install --global "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-36" > /dev/null
          # Bubblewrap looks for sdkmanager under tools/bin.
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Copy the app config into a build folder
        id: prep
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/twa"
          mkdir -p "$dir"
          if [ -n "${VERSION_CODE:-}" ]; then
            jq --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
              '.appVersionCode = $code | .appVersion = $name' \
              android/twa-manifest.json > "$dir/twa-manifest.json"
          else
            cp android/twa-manifest.json "$dir/twa-manifest.json"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up the signing key
        id: key
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
            alias="$KEY_ALIAS"
            {
              echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Throwaway key: proves the app builds, can't be uploaded to Play.
            pass="$(openssl rand -hex 16)"
            echo "::add-mask::$pass"
            alias=android
            keytool -genkeypair -keystore android.keystore -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 1 -storepass "$pass" -keypass "$pass" \
              -dname "CN=HealAll CI build" > /dev/null
            {
              echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$pass"
              echo "BUBBLEWRAP_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          jq --arg alias "$alias" '.signingKey.alias = $alias' twa-manifest.json > m.json && mv m.json twa-manifest.json

      - name: Generate the Android project
        working-directory: ${{ steps.prep.outputs.dir }}
        run: bubblewrap update --skipVersionUpgrade

      - name: Build and sign
        working-directory: ${{ steps.prep.outputs.dir }}
        run: bubblewrap build --skipPwaValidation

      - name: Summarise the build
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          RELEASE: ${{ steps.key.outputs.release }}
        run: |
          set -euo pipefail
          sha=$(keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            | awk '/SHA256:/ {print $2; exit}')
          {
            echo "### HealAll Android build"
            echo "- Version: $(jq -r '.appVersion' twa-manifest.json) (code $(jq -r '.appVersionCode' twa-manifest.json))"
            if [ "$RELEASE" = "true" ]; then
              echo "- Signed with the upload key. Upload \`app-release-bundle.aab\` to Play."
              echo "- Upload key SHA-256: \`$sha\` (one of the values for ANDROID_SHA256_CERT_FINGERPRINTS)"
            else
              echo "- Signed with a throwaway key: a build check only, not for Play."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f android.keystore

      - uses: actions/upload-artifact@v5
        with:
          name: healall-android-${{ steps.key.outputs.release == 'true' && 'release' || 'check' }}
          path: |
            ${{ steps.prep.outputs.dir }}/app-release-bundle.aab
            ${{ steps.prep.outputs.dir }}/app-release-signed.apk
          if-no-files-found: error
          retention-days: ${{ steps.key.outputs.release == 'true' && 30 || 3 }}
