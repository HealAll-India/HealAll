[project]
name = "healall-backend"
version = "0.1.0"
description = "HealAll Backend API - Volunteer-driven mutual aid platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
smtp = [
    "aiosmtplib>=3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "flower>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]
ignore = [
    "E501",    # line too long — handled by formatter
    "ARG001",  # unused function arg — FastAPI/slowapi require request/db/current_user in signatures
    "ARG002",  # unused method arg — same reason
    "N818",    # exception naming — HealAll uses domain naming convention
    "B008",    # function call in default arg — idiomatic FastAPI Query()/Depends()
    "T201",    # print found — seed.py is a CLI script
    "UP042",   # StrEnum migration — separate cleanup task
    "RET504",  # unnecessary assignment before return — readability choice
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
